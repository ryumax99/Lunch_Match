<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>파티 상세보기</title>
</head>
<body>

<h1>파티 상세보기</h1>

<!-- 파티 정보 표시 -->
<div>
    <p>제목: <span th:text="${party.title}"></span></p>
    <p>작성자 ID: <span th:text="${party.writerId}"></span></p>
    <p>내용: <span th:text="${party.content}"></span></p>
    <p>카테고리: <span th:text="${party.foodCategory}"></span></p>
    <p>제한 성별: <span th:text="${party.genderLimit}"></span></p>
</div>

<!-- 댓글 목록 -->
<h3>댓글</h3>
<div th:each="comment : ${commentList}">
    <p>
        <span th:text="${comment.writerId}">작성자</span> :
        <span th:text="${comment.content}">내용</span>

        <!-- 버튼은 한 줄에 함께 표시 -->
        <button type="button" th:onclick="'editComment(' + ${comment.id} + ')'">수정</button>
        <button type="button" th:onclick="'deleteComment(' + ${comment.id} + ')'">삭제</button>
    </p>
</div>

<!-- 댓글 작성 폼 -->
<form method="post" action="/comment/add">
    <input type="hidden" name="partyId" th:value="${party.id}" />
    <textarea name="content" placeholder="댓글을 입력하세요"></textarea>
    <button type="submit">댓글 등록</button>
</form>

<!-- JS는 반드시 HTML 끝에서 선언 -->
<script>
    function editComment(commentId) {
        alert('댓글 수정 기능: ' + commentId);
        // TODO: 수정 모달창 or 인라인 수정 구현
    }

    function deleteComment(commentId) {
        if (confirm("댓글을 삭제할까요?")) {
            // 페이지 이동 방식
            window.location.href = '/comment/delete?id=' + commentId;
        }
    }
</script>

</body>
</html>
