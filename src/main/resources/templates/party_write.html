<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>파티 모집 글쓰기</title>
</head>
<body>
<h1>파티 모집 글쓰기</h1>
<form method="post" action="/party/write">
    <label>제목: <input type="text" name="title"/></label><br/>
    <label>내용: <textarea name="content"></textarea></label><br/>
    <label>장소: <input type="text" name="locationName"/></label><br/>
    <label>위도: <input type="text" name="latitude"/></label><br/>
    <label>경도: <input type="text" name="longitude"/></label><br/>
    <label>카테고리:
        <select name="foodCategory">
            <option value="한식">한식</option>
            <option value="중식">중식</option>
            <option value="양식">양식</option>
        </select>
    </label><br/>
    <label>성별 제한:
        <select name="genderLimit">
            <option value="ALL">모두</option>
            <option value="MALE">남자만</option>
            <option value="FEMALE">여자만</option>
        </select>
    </label><br/>
    <label>모임 시간: <input type="datetime-local" name="partyTime"/></label><br/>
    <button type="submit">등록</button>
</form>
</body>
</html>
